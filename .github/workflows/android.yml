name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Installer et tester
        run: |
          npm ci
          npm test

      - name: Construire l'interface et synchroniser Android
        run: |
          npm run build
          npx cap sync android

      - name: Construire l'APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk English-Speak.apk

      - uses: actions/upload-artifact@v4
        with:
          name: English-Speak-apk
          path: English-Speak.apk

      - name: Publier l'APK dans les Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: English Speak (build ${{ github.run_number }})
          body: Télécharge English-Speak.apk sur ton téléphone Android et ouvre-le pour l'installer.
          files: English-Speak.apk
          make_latest: true
